[package]
name = "encore"
version = "0.1.0"
description = "Encore music provenance, direct support, and supporter pass Anchor program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "encore"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
