project_id = "encore"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[storage]
enabled = true
file_size_limit = "50MiB"

# Cron uses JOB_RUNNER_SECRET rather than a Supabase user JWT.
[functions.process-jobs]
verify_jwt = false
